[package]
name = "xidle"
version = "0.2.0"
edition = "2021"
authors = ["Maxwell Odri <maxwellodri@gmail.com>"]
description = "Print ms since the last real input (kernel evdev timestamps) — immune to X screensaver resets"

[dependencies]
anyhow = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
