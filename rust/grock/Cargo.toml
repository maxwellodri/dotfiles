[package]
name = "grock"
version = "0.1.0"
edition = "2021"
authors = ["Maxwell Odri <maxwellodri@gmail.com>"]
description = "Print Rust source trees with function bodies elided"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
ignore = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
