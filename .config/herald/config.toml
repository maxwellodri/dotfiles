# herald daemon config. Read once at daemon start; ${VAR} references expand
# from the daemon's environment at startup (e.g. $dotfile_tag from .zprofile).
#
# Notifications must carry >= 1 tag (`herald message --tag ...`); messages whose
# tags don't intersect `subscribe` are skipped (logged, never stored or shown).
# Empty list = accept every tagged message.
#
# machine_tag is implicitly added to every locally-originated notification, so
# local messages always pass subscribe; remote machines can target this box
# explicitly with the same tag.
#
# Known tags in use: pi, work_done, aria_dl
machine_tag = "${dotfile_tag}"
subscribe = ["${dotfile_tag}", "pi", "work_done", "aria_dl"]

# Cross-machine bus via self-hosted ntfy. Token is read from
# $XDG_DATA_HOME/herald/ntfy_token (~/.local/share/herald/ntfy_token, chmod 600):
#   pass show <host>-ntfy-token > ~/.local/share/herald/ntfy_token
# Without a token the daemon logs an error and stays local-only.
[ntfy]
url = "https://ntfy.odri.xyz"
# desk = "notify-desk"      # machine-to-machine envelope topic
# phone = "notify-phone"    # human-readable topic the phone app subscribes to
# presence = "presence"     # cache-less xidle beacons
# interval_secs = 15        # beacon period
# stale_secs = 45           # presence older than this is ignored
# active_idle_ms = 120000   # machine idle below this = "in use"
# token = "tk_..."          # inline (tests only — never real tokens in dotfiles)
# token_file = "/path"      # default: ~/.local/share/herald/ntfy_token
