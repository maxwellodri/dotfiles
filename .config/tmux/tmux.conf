# Enable mouse support for scrolling and pane selection
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clipboard"
# Scratch pane: toggle shown/hidden (see _tmux_scratch)
bind C-b run-shell "~/.config/tmux/_tmux_scratch toggle"
bind-key n next-window
bind-key p previous-window
set -g pane-border-lines heavy
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour46  # bright green
set -g pane-border-indicators arrows
unbind -n S-PPage
unbind -n S-NPage
## Vim
unbind m
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key H swap-pane -D
bind-key J swap-pane -D
bind-key K swap-pane -U
bind-key L swap-pane -U
bind-key x kill-pane
# guarded break-pane: never breaks the scratch out, never empties a window
bind ! run-shell "~/.config/tmux/_tmux_scratch guard-break"
bind-key M-Space run-shell "~/.config/tmux/layout_selector.sh"
bind-key m run-shell '~/.config/tmux/_tmux_move_window_selector'

set -g set-titles on
set -g set-titles-string "#W"
set -g automatic-rename off
set -g history-limit 10000
#############################
###   STATUS BAR STYLES   ###
#############################
setw -g window-status-current-format "#I:#W"
setw -g window-status-format "#I:#W"
# -- Base status bar style --
set -g status-style bg=colour235,fg=colour245
# -- Window status --
setw -g window-status-style fg=colour245,bg=colour235
setw -g window-status-current-style fg=white,bg=colour22
# -- Pane Borders --
set -g pane-active-border-style fg=colour46
# -- Right side of status bar --
set -g status-right "#(id -un)@#h"
set -g status-right-length 40
# -- Left side of status bar --
set -g status-left "[#S] "
set -g status-left-length 20
set -g status-position top
set -g renumber-windows on
# reap parked scratch panes when sessions die (gc also runs on every toggle;
# no format variable is used — session ids are checked directly against the
# live session list, so names with spaces or renames can't defeat it)
set-hook -g session-closed 'run-shell "~/.config/tmux/_tmux_scratch gc"'
